name: md-pdf-editor

services:
  md-pdf-editor:
    build:
      context: .
      target: runtime
    container_name: md-pdf-editor
    # Chromiumの子プロセスを確実に回収する
    init: true
    restart: unless-stopped
    ports:
      # 認証機能が無いため、既定ではこのPCからのみ接続できる(変更は .env の BIND_ADDR)
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8088}:8080"
    environment:
      MAX_MARKDOWN_BYTES: ${MAX_MARKDOWN_BYTES:-31457280}
      PDF_TIMEOUT_MS: ${PDF_TIMEOUT_MS:-60000}
    # Chromiumの共有メモリ(既定の64MBでは大きな文書で落ちる)
    shm_size: "1gb"
    # PDF生成のChromiumは --no-sandbox で動かすため、コンテナ側で権限を絞る
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
